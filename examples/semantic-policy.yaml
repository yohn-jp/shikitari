policy:
  id: shikitari.example
  version: 2
  title: Example TypeScript coding and naming policy
  domains:
    - formatting
    - naming
  naming-evidence:
    source: docs/research/naming-discovery.md
    role: observed-evidence-only
    observed-is-not-canonical: true
  rules:
    - id: formatting.indentation
      domain: formatting
      scope:
        languages: [typescript]
        file-kinds: [source]
      requirement:
        action: require
        subject: indentation
      value:
        unit: spaces
        width: 2
      intent: Keep nesting depth visible and consistent across source files.

    - id: formatting.quote-delimiter
      domain: formatting
      scope:
        languages: [typescript]
        constructs: [string-literal]
      requirement:
        action: prefer
        subject: quote-delimiter
      value:
        delimiter: double
      intent: Use one predictable delimiter while allowing an exception when it avoids unnecessary escaping.

    - id: formatting.semicolon-termination
      domain: formatting
      scope:
        languages: [typescript]
        constructs: [statement]
      requirement:
        action: require
        subject: semicolon-termination
      value:
        presence: present
      intent: Make statement boundaries explicit.

    - id: formatting.trailing-comma
      domain: formatting
      scope:
        languages: [typescript]
        constructs: [delimited-construct]
      conditions:
        all:
          - field: construct
            operator: in
            value: [array, object, argument-list, parameter-list, import-list, export-list]
          - field: layout
            operator: equals
            value: multiline
      requirement:
        action: require
        subject: trailing-comma
      value:
        presence: present
      intent: Make multiline edits produce small, stable diffs.

    - id: formatting.line-width
      domain: formatting
      scope:
        languages: [typescript]
        file-kinds: [source]
      requirement:
        action: require
        subject: line-width
      value:
        maximum: 100
        unit: source-columns
      constraints:
        - field: measurement
          operator: equals
          value: rendered-line-columns
      intent: Keep source readable in ordinary editor and review widths.

    - id: formatting.line-ending
      domain: formatting
      scope:
        file-kinds: [source]
      requirement:
        action: require
        subject: line-ending
      value:
        sequence: lf
      intent: Keep text representation consistent across operating systems.

    - id: naming.form
      domain: naming
      scope:
        languages: [typescript]
        symbol-kinds:
          [variable, constant, parameter, property, function, method, class, interface, type, enum, enum-member]
      requirement:
        action: require
        subject: identifier-form
      value:
        casing-by-symbol-kind:
          variable: camel
          constant: upper-snake
          function: camel
          method: camel
          class: pascal
          interface: pascal
          type: pascal
          enum: pascal
          enum-member: upper-snake
        acronym-handling: treat-as-word
        prefixes:
          - symbol-kinds: [property, method]
            reason: private-member
            form: underscore
        suffixes:
          - symbol-kinds: [type]
            reason: type-alias
            form: type
        pluralization:
          collection-values: plural
      intent: Make a symbol's role visible from its written form, including collection plurality.

    - id: naming.lexicon
      domain: naming
      scope:
        languages: [typescript]
        symbol-kinds:
          [variable, constant, parameter, property, function, method, class, interface, type, enum, enum-member]
      requirement:
        action: prefer
        subject: identifier-lexicon
      value:
        terms:
          - term: repository
            strength: canonical
            reason: Use the full term for a repository.
          - term: configuration
            strength: canonical
            reason: Use the full term for configuration data or behavior.
          - term: diagnostic
            strength: preferred
            reason: Name an observed diagnostic rather than an unspecified message.
          - term: repo
            strength: discouraged
            replacement: repository
            reason: The abbreviation is understandable but less portable.
          - term: config
            strength: discouraged
            replacement: configuration
            reason: The abbreviation is understandable but less portable.
          - term: naming-statistics
            strength: forbidden
            replacement: naming-evidence
            reason: Discovery counts are evidence, not the semantic concept.
      intent: Prefer vocabulary that remains clear outside its local context while preserving explicit strength.

    - id: naming.semantics
      domain: naming
      scope:
        languages: [typescript]
        symbol-kinds: [variable, parameter, property, function, method]
      requirement:
        action: require
        subject: semantic-name
      value:
        verbs:
          - behavior: retrieve-known-value
            terms:
              - term: get
                strength: preferred
              - term: find
                strength: forbidden
          - behavior: search-for-match
            terms:
              - term: find
                strength: preferred
              - term: get
                strength: forbidden
          - behavior: introduce-new-value
            terms:
              - term: create
                strength: preferred
          - behavior: detach-without-erasing
            terms:
              - term: remove
                strength: preferred
              - term: delete
                strength: forbidden
          - behavior: erase-permanently
            terms:
              - term: delete
                strength: preferred
              - term: remove
                strength: forbidden
        boolean-prefixes:
          - meaning: state
            terms:
              - term: is
                strength: preferred
          - meaning: possession-or-containment
            terms:
              - term: has
                strength: preferred
          - meaning: capability
            terms:
              - term: can
                strength: preferred
      intent: Choose a verb or prefix from the behavior it communicates; these are explicit decisions, not frequency-derived synonyms.

    - id: naming.concepts
      domain: naming
      scope:
        languages: [typescript]
        symbol-kinds: [variable, constant, parameter, property, function, method, class, interface, type, enum]
      requirement:
        action: require
        subject: domain-concept-terminology
      value:
        organization-shared:
          - id: repository
            canonical-term: repository
            allowed-aliases: []
            forbidden-aliases: []
          - id: diagnostic
            canonical-term: diagnostic
            allowed-aliases: [diagnostics]
            forbidden-aliases: []
        repository-specific:
          - id: naming-evidence
            canonical-term: naming evidence
            allowed-aliases: [discovery evidence]
            forbidden-aliases: [naming statistics]
          - id: semantic-policy
            canonical-term: semantic policy
            allowed-aliases: [policy model]
            forbidden-aliases: [tool configuration]
      intent: Keep shared terminology separate from Shikitari-specific concepts, with aliases decided explicitly.

    - id: naming.constraints
      domain: naming
      requirement:
        action: require
        subject: naming-constraints
      value:
        builtin-language-knowledge:
          - language: typescript
            source: typescript-language
            constraints:
              - kind: reserved-identifier
                outcome: violation
                identifiers:
                  [
                    await,
                    break,
                    case,
                    catch,
                    class,
                    const,
                    continue,
                    debugger,
                    default,
                    delete,
                    do,
                    else,
                    enum,
                    export,
                    extends,
                    false,
                    finally,
                    for,
                    function,
                    if,
                    import,
                    in,
                    instanceof,
                    new,
                    null,
                    return,
                    super,
                    switch,
                    this,
                    throw,
                    true,
                    try,
                    typeof,
                    var,
                    void,
                    while,
                    with,
                    yield,
                  ]
              - kind: typescript-keyword
                outcome: violation-when-used-in-a-reserved-position
                identifiers:
                  [
                    abstract,
                    any,
                    as,
                    asserts,
                    bigint,
                    boolean,
                    constructor,
                    declare,
                    get,
                    infer,
                    interface,
                    keyof,
                    let,
                    module,
                    namespace,
                    never,
                    number,
                    object,
                    out,
                    override,
                    package,
                    private,
                    protected,
                    public,
                    readonly,
                    require,
                    satisfies,
                    set,
                    static,
                    string,
                    symbol,
                    type,
                    undefined,
                    unique,
                    unknown,
                    using,
                  ]
            handling: Apply TypeScript grammar rules as builtin knowledge; do not copy these words into the repository lexicon.
        repository-constraints: []
      intent: Apply language restrictions independently from repository vocabulary and adapter configuration.

    - id: naming.validation-outcomes
      domain: naming
      requirement:
        action: require
        subject: naming-validation-outcome
      value:
        outcomes:
          canonical-or-allowed:
            meaning: The name matches a canonical, preferred, or discouraged decision, or an explicitly allowed alias in scope; retain the lexicon strength in the report.
          violation:
            meaning: The name matches a forbidden decision or builtin language constraint.
          unknown-requires-decision:
            meaning: The Canon and builtin knowledge do not decide the name.
            handling: Record the unknown and request a maintainer decision; do not infer, accept, or forbid it.
      intent: Make unresolved names visible instead of turning missing policy into silent acceptance or rejection.
